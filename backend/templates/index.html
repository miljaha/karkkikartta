<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Karkille.fi</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: sans-serif; }
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([60.1699, 24.9384], 12); // Helsinki

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    function makeIcon(color) {
      return L.divIcon({
        className: 'custom-marker',
        html: `<div style="
          background-color: ${color};
          width: 20px;
          height: 20px;
          border-radius: 50% 50% 50% 0;
          transform: rotate(-45deg);
          border: 2px solid white;
          box-shadow: 0 0 2px rgba(0,0,0,0.5);
        "></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 20],
      });
    }

    const normalIcon = makeIcon('#3388ff');   // Leaflet's default blue
    const campaignIcon = makeIcon('#ff3333'); // red for active campaigns
    const noCandyIcon = makeIcon('#999999');  // store has no loose candy

    fetch('/api/stores')
      .then(response => response.json())
      .then(stores => {
        stores.forEach(store => {
  let priceHtml;
  if (store.is_campaign) {
    const basePart = store.base_price !== null
      ? `<s>${store.base_price.toFixed(2)} €</s> `
      : '';
    priceHtml = `${basePart}<b>${store.price.toFixed(2)} €</b> (campaign!, no membership needed)`;
  } else if (store.price !== null) {
    priceHtml = `${store.price.toFixed(2)} € (no membership needed)`;
  } else {
    priceHtml = `<i>No price yet — be the first to add one!</i>`;
  }
  const memberHtml = store.member_price
    ? `<br>${store.member_price.toFixed(2)} € <i>(requires membership)</i>`
    : '';

  const header = `
    <b>${store.name}</b><br>
    ${store.candy_provider || ''}<br>
    ${store.address || ''}<br>
  `;

  let popupContent;
  if (store.has_loose_candy) {
    popupContent = `
      ${header}
      ${priceHtml}${memberHtml}
      <hr>
      <form id="update-form-${store.id}">
        <label><input type="radio" name="type" value="base" checked> Base price</label>
        <label><input type="radio" name="type" value="campaign"> Campaign price</label><br>
        <input type="number" step="0.01" name="price" placeholder="Price (€)" required><br>
        <div class="campaign-fields" style="display:none;">
          Start: <input type="date" name="start_date"><br>
          End: <input type="date" name="end_date"><br>
          <label><input type="checkbox" name="is_chain_wide"> Chain-wide</label><br>
          <label><input type="checkbox" name="requires_membership"> Requires membership</label><br>
        </div>
        <button type="submit">Update price</button>
      </form>
      <hr>
      <button type="button" id="toggle-candy-${store.id}">This store has no irtokarkit</button>
    `;
  } else {
    popupContent = `
      ${header}
      <i>Marked as having no irtokarkit.</i>
      <hr>
      <button type="button" id="toggle-candy-${store.id}">This store does have irtokarkit</button>
    `;
  }

  const icon = !store.has_loose_candy
    ? noCandyIcon
    : (store.is_campaign || store.member_price) ? campaignIcon : normalIcon;

  const marker = L.marker([store.latitude, store.longitude], { icon })
    .addTo(map)
    .bindPopup(popupContent);

  marker.on('popupopen', () => {
    // toggle button (exists in both versions of the popup)
    document.getElementById(`toggle-candy-${store.id}`).addEventListener('click', () => {
      fetch(`/api/stores/${store.id}/loose-candy`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ has_loose_candy: !store.has_loose_candy })
      })
        .then(res => res.json())
        .then(result => {
          if (result.error) alert(result.error);
          else location.reload();
        });
    });

    // price form only exists when the store has loose candy
    const form = document.getElementById(`update-form-${store.id}`);
    if (!form) return;
    const campaignFields = form.querySelector('.campaign-fields');

    form.querySelectorAll('input[name="type"]').forEach(radio => {
      radio.addEventListener('change', () => {
        campaignFields.style.display = radio.value === 'campaign' ? 'block' : 'none';
      });
    });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const formData = new FormData(form);
      const body = {
        type: formData.get('type'),
        price: parseFloat(formData.get('price')),
        start_date: formData.get('start_date'),
        end_date: formData.get('end_date'),
        is_chain_wide: formData.get('is_chain_wide') === 'on',
        requires_membership: formData.get('requires_membership') === 'on',
      };

      fetch(`/api/stores/${store.id}/update-price`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      })
        .then(res => res.json())
        .then(result => {
          if (result.error) alert(result.error);
          else { alert('Price updated!'); location.reload(); }
        });
    });
  });
});
      });
  </script>
</body>
</html>
